<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0d; --bg-2:#0d0d11; --card:#131318; --card-2:#17171d;
    --line:#22222a; --line-2:#2c2c36;
    --text:#e5e5ea; --text-2:#b4b4be; --muted:#8a8a94; --dim:#5c5c66;
    --violet:#8b5cf6; --violet-soft:rgba(139,92,246,0.12); --violet-line:rgba(139,92,246,0.38);
    --magenta:#ec4899; --magenta-soft:rgba(236,72,153,0.12); --magenta-line:rgba(236,72,153,0.38);
    --green:#34d399; --red:#f87171;
    --f-sans:'Inter',-apple-system,system-ui,sans-serif;
    --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --r-2:4px; --r-3:6px; --r-4:8px; --r-6:12px; --r-8:16px; --r-14:14px; --r-round:999px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--violet);text-decoration:none;}
  a:hover{color:var(--magenta);}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;background:radial-gradient(circle at 30% 20%, #17131f 0%, #0a0a0d 62%);overflow:hidden;">
  <!-- ambient glows -->
  <div style="position:absolute;top:-140px;left:12%;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle, rgba(139,92,246,0.16), transparent 70%);pointer-events:none;"></div>
  <div style="position:absolute;bottom:-160px;right:8%;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle, rgba(236,72,153,0.12), transparent 70%);pointer-events:none;"></div>

  <div style="position:relative;width:380px;max-width:100%;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-14);padding:32px 30px;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <!-- Brand lockup -->
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-bottom:26px;">
      <div style="width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--violet),var(--magenta));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(139,92,246,0.4);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0a0a0d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>
      </div>
      <div>
        <h1 style="font-size:26px;font-weight:800;letter-spacing:0.03em;margin:0;">PROSPEKT</h1>
        <div style="font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.24em;color:var(--muted);text-transform:uppercase;margin-top:5px;">Challenger Scouting</div>
      </div>
      <div style="color:var(--muted);font-size:12.5px;">Pro edition — internal use</div>
    </div>

    <!-- Form -->
    <form style="display:flex;flex-direction:column;gap:14px;" onsubmit="return false;">
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase;">Username</span>
        <span style="display:flex;align-items:center;gap:9px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-4);padding:10px 12px;transition:border-color 150ms;" style-focus-within="border-color:var(--violet-line);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" value="head.scout" style="flex:1;background:transparent;border:0;outline:0;color:var(--text);font-family:inherit;font-size:13.5px;" />
        </span>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase;">Password</span>
        <span style="display:flex;align-items:center;gap:9px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-4);padding:10px 12px;transition:border-color 150ms;" style-focus-within="border-color:var(--violet-line);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" value="············" style="flex:1;background:transparent;border:0;outline:0;color:var(--text);font-family:inherit;font-size:13.5px;letter-spacing:0.15em;" />
        </span>
      </label>

      <!-- error line (hidden by default) -->
      <div style="display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--red);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Invalid username or password.
      </div>

      <button type="submit" style="margin-top:4px;width:100%;padding:11px;border-radius:var(--r-4);font-size:14px;font-weight:700;background:var(--violet);color:#0a0a0d;border:1px solid transparent;cursor:pointer;transition:filter 150ms;box-shadow:0 0 0 1px var(--violet-line),0 8px 22px rgba(139,92,246,0.3);" style-hover="filter:brightness(1.08);">Sign in</button>
    </form>

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:0.08em;color:var(--dim);">
      Auth-gated · No public signup · Contact an admin
    </div>
  </div>

  <!-- ===== error-state variant (shown below for reference) ===== -->
  <div style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;letter-spacing:0.16em;color:var(--dim);text-transform:uppercase;">PROSPEKT · Challenger Scouting — Pro Edition</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1024,&quot;height&quot;:720}}"></script>
</body>
</html>
